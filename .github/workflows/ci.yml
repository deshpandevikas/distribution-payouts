name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit and property tests
        run: npm test

      - name: Harness fixed seeds
        run: npm run harness -- --seeds=1,2,3,42,100,999,1234,5678,9999,10000

      - name: Break-it flags each fail an invariant
        run: |
          # Exit 1 only: 0 means the flag broke nothing, 2 means the harness
          # crashed (uncaught exception, bad flag). A crash is not a catch.
          for flag in skipIntentRecord timeoutAsFailure newKeyOnRetry overwriteConflictingConfirm resendWithoutStatusCheck; do
            code=0
            npm run harness -- --scenarios=50 --break-it=$flag || code=$?
            if [ "$code" -ne 1 ]; then
              echo "ERROR: $flag exited $code, expected 1 (0 = broke nothing, 2 = harness crash)"
              exit 1
            fi
            echo "OK: $flag failed an invariant (exit 1)"
          done
          echo "All 5 break-it flags confirmed failing with exit 1."
