name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    # Pinned, not ubuntu-latest: that label is mid-migration to 26.04
    # (2026-10-19 to 2026-11-19), so the OS would change under the build.
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: better-sqlite3 loads a Node 26 prebuild (no source compile)
        run: |
          # Rule: use the prebuild, or fall back to node:sqlite. A source
          # build would pass here too (the runner has gcc), so the assertion is
          # on the install log: no gyp means a downloaded binary was used.
          probe=$(mktemp -d)
          cd "$probe"
          npm init -y > /dev/null
          npm install better-sqlite3@13.2.0 --no-audit --no-fund > install.log 2>&1
          if grep -qE "node-gyp|gyp info" install.log; then
            echo "::error::better-sqlite3 compiled from source - no prebuild for this Node"
            cat install.log
            exit 1
          fi
          node -e "const D=require('better-sqlite3');const db=new D(':memory:');db.exec('create table t(a)');db.prepare('insert into t values (1)').run();const c=db.prepare('select count(*) c from t').get().c;if(c!==1)process.exit(1);console.log('prebuilt binary loaded, sqlite',db.prepare('select sqlite_version() v').get().v)"

      - name: Type check
        run: npm run typecheck

      - name: Unit and property tests
        run: npm test

      - name: Harness fixed seeds
        run: npm run harness -- --seeds=1,2,3,42,100,999,1234,5678,9999,10000

      - name: Harness on the SQLite store
        run: npm run harness -- --scenarios=200 --store=sqlite

      - name: Break-it flags each fail an invariant
        run: |
          # Exit 1 only: 0 means the flag broke nothing, 2 means the harness
          # crashed (uncaught exception, bad flag). A crash is not a catch.
          for flag in skipIntentRecord timeoutAsFailure newKeyOnRetry overwriteConflictingConfirm resendWithoutStatusCheck; do
            code=0
            npm run harness -- --scenarios=50 --break-it=$flag || code=$?
            if [ "$code" -ne 1 ]; then
              echo "ERROR: $flag exited $code, expected 1 (0 = broke nothing, 2 = harness crash)"
              exit 1
            fi
            echo "OK: $flag failed an invariant (exit 1)"
          done
          echo "All 5 break-it flags confirmed failing with exit 1."
