<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Distribution payouts - replay</title>
    <style>
      :root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, sans-serif; }
      body { margin: 0; padding: 1.25rem; max-width: 1100px; line-height: 1.45; }
      h1 { font-size: 1.3rem; margin: 0 0 .25rem; }
      .sub { opacity: .7; margin: 0 0 1rem; font-size: .85rem; }
      form { display: flex; flex-wrap: wrap; gap: .75rem; align-items: end; padding: .75rem; border: 1px solid #8884; border-radius: .5rem; }
      label { display: flex; flex-direction: column; font-size: .75rem; gap: .2rem; }
      input[type=number] { width: 7rem; }
      button { padding: .4rem .9rem; font-weight: 600; cursor: pointer; }
      table { border-collapse: collapse; width: 100%; font-size: .82rem; margin-top: .5rem; }
      th, td { text-align: left; padding: .25rem .4rem; border-bottom: 1px solid #8883; }
      code { font-size: .78rem; }
      .ok { color: #17794b; font-weight: 600; }
      .bad { color: #c02626; font-weight: 600; }
      section { margin-top: 1.25rem; }
      h2 { font-size: 1rem; margin: 0 0 .25rem; }
      .state { font-family: ui-monospace, monospace; font-size: .78rem; }
    </style>
  </head>
  <body>
    <h1>Distribution payouts - replay</h1>
    <p class="sub">
      Same core as the runner and the harness: in-memory store, fake bank, real transition table.
      A seed always produces the same run, so a link is a reproducible scenario.
    </p>

    <form id="controls">
      <label>Seed <input id="seed" type="number" min="1" value="1" /></label>
      <label>Investors <input id="investors" type="number" min="1" max="40" value="6" /></label>
      <label>Total cents <input id="total" type="number" min="1" step="1" value="60000" /></label>
      <label>Timeout rate <input id="timeoutRate" type="number" min="0" max="1" step="0.05" value="0.2" /></label>
      <label>Transient reject rate <input id="transientRejectRate" type="number" min="0" max="1" step="0.05" value="0.1" /></label>
      <label>Lying transient rate <input id="lyingTransientRate" type="number" min="0" max="1" step="0.05" value="0" /></label>
      <label>Async confirm rate <input id="asyncConfirmRate" type="number" min="0" max="1" step="0.05" value="0.5" /></label>
      <label>Late confirm (checks) <input id="asyncDelayChecks" type="number" min="0" step="1" value="0" /></label>
      <label>Dropped confirm rate <input id="asyncDropRate" type="number" min="0" max="1" step="0.05" value="0" /></label>
      <label>Break-it flag
        <select id="flag">
          <option value="">none</option>
          <option value="skipIntentRecord">skipIntentRecord</option>
          <option value="timeoutAsFailure">timeoutAsFailure</option>
          <option value="newKeyOnRetry">newKeyOnRetry</option>
          <option value="overwriteConflictingConfirm">overwriteConflictingConfirm</option>
          <option value="resendWithoutStatusCheck">resendWithoutStatusCheck</option>
        </select>
      </label>
      <button type="submit">Run</button>
    </form>

    <section id="summary"></section>
    <section id="invariants"></section>
    <section id="payments"></section>
    <section id="audit"></section>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
